<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scatterplot Map — PowerPoint Add-in</title>

  <!-- Office.js -->
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>

  <style>
    /* ── Reset & Layout ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif;
      background: #f5f6fa; color: #333;
    }
    #app { width: 100%; height: 100%; display: flex; flex-direction: column; }

    /* ── Toolbar ─────────────────────────────────────────────── */
    #toolbar {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; background: #fff;
      border-bottom: 1px solid #dde1e8;
      flex-shrink: 0; flex-wrap: wrap; z-index: 10;
    }
    .tg { display: flex; align-items: center; gap: 4px; }
    .tg label { font-size: 12px; font-weight: 600; color: #555; }
    #search-input {
      width: 130px; padding: 4px 6px;
      border: 1px solid #ccc; border-radius: 3px; font-size: 12px;
    }
    #clear-search {
      background: none; border: none; cursor: pointer;
      font-size: 14px; color: #999; line-height: 1;
    }
    #region-filter {
      padding: 4px 6px; border: 1px solid #ccc;
      border-radius: 3px; font-size: 12px; max-width: 110px;
    }
    .btn {
      padding: 4px 8px; border: 1px solid #bbb;
      border-radius: 3px; background: #fff; cursor: pointer; font-size: 12px;
    }
    .btn:hover { background: #eee; }
    .file-label {
      display: inline-block; padding: 4px 8px;
      border: 1px solid #bbb; border-radius: 3px;
      background: #fff; cursor: pointer; font-size: 12px; font-weight: 600;
    }
    .file-label:hover { background: #eee; }
    #csv-upload { display: none; }
    #insert-btn {
      padding: 4px 10px; border: 1px solid #0078d4;
      border-radius: 3px; background: #0078d4; color: #fff;
      cursor: pointer; font-size: 12px; font-weight: 600;
    }
    #insert-btn:hover { background: #106ebe; }
    .zoom-display { margin-left: auto; font-size: 11px; color: #666; }

    /* ── Canvas ───────────────────────────────────────────────── */
    #scatter-canvas { flex: 1; display: block; cursor: grab; }
    #scatter-canvas.dragging { cursor: grabbing; }

    /* ── Tooltip ──────────────────────────────────────────────── */
    #tooltip {
      position: fixed; padding: 6px 10px;
      background: rgba(30,30,30,0.92); color: #fff;
      border-radius: 5px; font-size: 11px; line-height: 1.4;
      pointer-events: none; z-index: 100; max-width: 240px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25); white-space: pre-line;
    }
    #tooltip.hidden { display: none; }

    /* ── Detail Panel ────────────────────────────────────────── */
    #detail-panel {
      position: fixed; top: 50px; right: 8px; width: 240px;
      max-height: calc(100vh - 60px); overflow-y: auto;
      background: #fff; border-radius: 6px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.14); padding: 12px; z-index: 50;
    }
    #detail-panel.hidden { display: none; }
    #close-detail {
      position: absolute; top: 6px; right: 8px;
      background: none; border: none; font-size: 18px; cursor: pointer; color: #999;
    }
    #detail-title { font-size: 14px; margin-bottom: 8px; padding-right: 20px; }
    #detail-body { font-size: 12px; line-height: 1.5; color: #555; }
    #detail-body .field { margin-bottom: 4px; }
    #detail-body .field-key { font-weight: 600; color: #333; }

    /* ── Status bar ──────────────────────────────────────────── */
    #status { font-size: 11px; color: #888; padding: 4px 10px; background: #fff; border-top: 1px solid #eee; }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <div class="tg">
        <label for="search-input">Search:</label>
        <input type="text" id="search-input" placeholder="Find..." autocomplete="off">
        <button id="clear-search">&times;</button>
      </div>
      <div class="tg">
        <label for="region-filter">Region:</label>
        <select id="region-filter"><option value="__all__">All</option></select>
      </div>
      <div class="tg">
        <button class="btn" id="btn-reset-view">Reset</button>
        <button class="btn" id="btn-zoom-in">+</button>
        <button class="btn" id="btn-zoom-out">&minus;</button>
      </div>
      <div class="tg">
        <label for="csv-upload" class="file-label">Import CSV</label>
        <input type="file" id="csv-upload" accept=".csv">
      </div>
      <div class="tg">
        <button id="insert-btn" title="Insert current view as image into the active slide">Insert into Slide</button>
      </div>
      <div class="tg zoom-display">
        Zoom: <span id="zoom-level">1.00</span>x
      </div>
    </div>

    <canvas id="scatter-canvas"></canvas>
    <div id="tooltip" class="hidden"></div>
    <div id="detail-panel" class="hidden">
      <button id="close-detail">&times;</button>
      <h3 id="detail-title"></h3>
      <div id="detail-body"></div>
    </div>
    <div id="status">Ready</div>
  </div>

  <!-- Reuse the same engine -->
  <script src="../webapp/engine.js"></script>
  <script>
  "use strict";
  Office.onReady(function (info) {
    if (info.host !== Office.HostType.PowerPoint) {
      document.getElementById("insert-btn").style.display = "none";
    }
    init();
  });

  function init() {
    var canvas = document.getElementById("scatter-canvas");
    var engine = new ScatterEngine(canvas);
    var tooltip      = document.getElementById("tooltip");
    var detailPanel  = document.getElementById("detail-panel");
    var detailTitle  = document.getElementById("detail-title");
    var detailBody   = document.getElementById("detail-body");
    var searchInput  = document.getElementById("search-input");
    var regionFilter = document.getElementById("region-filter");
    var zoomDisplay  = document.getElementById("zoom-level");
    var status       = document.getElementById("status");

    /* ── Demo data ──────────────────────────────────────────── */
    function loadDemoData() {
      var regions = [
        { xMin:0,xMax:35,yMin:60,yMax:100, color:"rgba(46,204,113,0.08)", label:"High Growth" },
        { xMin:35,xMax:70,yMin:30,yMax:70,  color:"rgba(52,152,219,0.08)", label:"Stable" },
        { xMin:60,xMax:100,yMin:0,yMax:40,  color:"rgba(231,76,60,0.07)",  label:"Declining" },
        { xMin:0,xMax:30,yMin:0,yMax:30,    color:"rgba(155,89,182,0.07)", label:"Emerging" },
      ];
      engine.setRegions(regions);
      engine.axisTitle.x = "Market Share (%)";
      engine.axisTitle.y = "Growth Rate (%)";

      var names = [
        "Alpha Corp","Beta Inc","Gamma LLC","Delta Co","Epsilon Ltd",
        "Zeta Group","Eta Partners","Theta Ventures","Iota Systems","Kappa Tech",
        "Lambda AI","Mu Robotics","Nu Energy","Xi Finance","Omicron Health",
        "Pi Media","Rho Logistics","Sigma Bio","Tau Materials","Upsilon Foods",
        "Phi Aero","Chi Analytics","Psi Networks","Omega Cloud","Star Digital"
      ];
      var regionNames = ["Technology","Healthcare","Finance","Energy","Consumer"];
      var points = [];
      var seed = 42;
      function rand() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
      for (var i = 0; i < names.length; i++) {
        points.push({
          x: rand() * 95 + 2, y: rand() * 95 + 2,
          label: names[i],
          region: regionNames[i % regionNames.length],
          color: ["#5b8def","#2ecc71","#e67e22","#9b59b6","#e74c3c"][i % 5],
          priority: (i < 10) ? 1 : (i < 18) ? 2 : 3
        });
      }
      engine.setPoints(points);
      populateRegionFilter();
      engine.fitAll();
      render();
    }

    /* ── CSV parsing ────────────────────────────────────────── */
    function parseCSV(text) {
      var lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) return [];
      var headers = parseCSVLine(lines[0]);
      var rows = [];
      for (var i = 1; i < lines.length; i++) {
        var vals = parseCSVLine(lines[i]);
        if (vals.length < 2) continue;
        var obj = {};
        for (var j = 0; j < headers.length; j++) {
          obj[headers[j].trim().toLowerCase()] = (vals[j] || "").trim();
        }
        rows.push(obj);
      }
      return rows;
    }
    function parseCSVLine(line) {
      var result = []; var current = ""; var inQ = false;
      for (var i = 0; i < line.length; i++) {
        var ch = line[i];
        if (inQ) {
          if (ch === '"' && line[i+1] === '"') { current += '"'; i++; }
          else if (ch === '"') inQ = false;
          else current += ch;
        } else {
          if (ch === '"') inQ = true;
          else if (ch === ',') { result.push(current); current = ""; }
          else current += ch;
        }
      }
      result.push(current); return result;
    }
    function loadCSVData(rows) {
      var keys = Object.keys(rows[0]);
      var xKey = null, yKey = null, labelKey = null, regionKey = null;
      for (var k = 0; k < keys.length; k++) {
        var kl = keys[k].toLowerCase();
        if (kl === "x") xKey = keys[k];
        if (kl === "y") yKey = keys[k];
        if (kl === "label" || kl === "name") labelKey = keys[k];
        if (kl === "region" || kl === "group" || kl === "category") regionKey = keys[k];
      }
      if (!xKey || !yKey) {
        var nc = [];
        for (var c = 0; c < keys.length; c++) {
          if (!isNaN(parseFloat(rows[0][keys[c]]))) nc.push(keys[c]);
        }
        if (!xKey && nc.length > 0) xKey = nc[0];
        if (!yKey && nc.length > 1) yKey = nc[1];
      }
      if (!xKey || !yKey) { status.textContent = "Error: need x and y columns"; return; }
      engine.axisTitle.x = xKey;
      engine.axisTitle.y = yKey;
      var colors = ["#5b8def","#2ecc71","#e67e22","#9b59b6","#e74c3c","#1abc9c","#f39c12","#3498db"];
      var rc = {}; var ci = 0;
      var points = [];
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i]; var px = parseFloat(r[xKey]); var py = parseFloat(r[yKey]);
        if (isNaN(px) || isNaN(py)) continue;
        var region = regionKey ? r[regionKey] : "Default";
        if (!(region in rc)) { rc[region] = colors[ci % colors.length]; ci++; }
        var pt = { x:px, y:py, label: labelKey ? r[labelKey] : "Point "+(i+1),
                   region:region, color:rc[region],
                   priority: (i < rows.length*0.3)?1:(i < rows.length*0.6)?2:3 };
        for (var ek = 0; ek < keys.length; ek++) {
          var ekey = keys[ek];
          if (ekey !== xKey && ekey !== yKey && ekey !== labelKey && ekey !== regionKey) pt[ekey] = r[ekey];
        }
        points.push(pt);
      }
      engine.setPoints(points);
      engine.setRegions([]);
      populateRegionFilter();
      engine.fitAll();
      status.textContent = "Loaded " + points.length + " points";
      render();
    }
    document.getElementById("csv-upload").addEventListener("change", function(e) {
      var file = e.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) { var rows = parseCSV(ev.target.result); if (rows.length) loadCSVData(rows); };
      reader.readAsText(file);
    });

    /* ── Region filter ──────────────────────────────────────── */
    function populateRegionFilter() {
      var seen = {};
      for (var i = 0; i < engine.points.length; i++) seen[engine.points[i].region] = true;
      regionFilter.innerHTML = '<option value="__all__">All</option>';
      Object.keys(seen).sort().forEach(function(r) {
        var opt = document.createElement("option"); opt.value = r; opt.textContent = r;
        regionFilter.appendChild(opt);
      });
    }
    regionFilter.addEventListener("change", function() { engine.activeRegion = regionFilter.value; render(); });

    /* ── Search ─────────────────────────────────────────────── */
    searchInput.addEventListener("input", function() {
      var term = searchInput.value.trim().toLowerCase();
      engine.searchTerm = term; engine.searchMatches.clear();
      if (term) {
        for (var i = 0; i < engine.points.length; i++) {
          if (engine.points[i].label && engine.points[i].label.toLowerCase().indexOf(term) !== -1)
            engine.searchMatches.add(i);
        }
      }
      render();
    });
    document.getElementById("clear-search").addEventListener("click", function() {
      searchInput.value = ""; engine.searchTerm = ""; engine.searchMatches.clear(); render();
    });

    /* ── Toolbar buttons ────────────────────────────────────── */
    document.getElementById("btn-reset-view").addEventListener("click", function() {
      engine.fitAll(); updateZoom(); render();
    });
    document.getElementById("btn-zoom-in").addEventListener("click", function() {
      engine.zoomAt(engine.W/2, engine.H/2, 1.4); updateZoom(); render();
    });
    document.getElementById("btn-zoom-out").addEventListener("click", function() {
      engine.zoomAt(engine.W/2, engine.H/2, 1/1.4); updateZoom(); render();
    });
    function updateZoom() { zoomDisplay.textContent = engine.cam.zoom.toFixed(2); }

    /* ── Mouse interaction ──────────────────────────────────── */
    var isDragging = false; var drag = {x:0, y:0};
    canvas.addEventListener("mousedown", function(e) {
      isDragging = true; drag.x = e.clientX; drag.y = e.clientY;
      canvas.classList.add("dragging");
    });
    window.addEventListener("mousemove", function(e) {
      if (isDragging) {
        engine.pan(e.clientX - drag.x, e.clientY - drag.y);
        drag.x = e.clientX; drag.y = e.clientY; render(); return;
      }
      var rect = canvas.getBoundingClientRect();
      var mx = e.clientX - rect.left, my = e.clientY - rect.top;
      var hit = engine.hitTest(mx, my);
      if (hit !== engine.hoveredIndex) { engine.hoveredIndex = hit; render(); }
      if (hit >= 0) {
        var p = engine.points[hit];
        tooltip.textContent = p.label + "\n" + engine.axisTitle.x + ": " + p.x.toFixed(2) +
                              "\n" + engine.axisTitle.y + ": " + p.y.toFixed(2);
        tooltip.classList.remove("hidden");
        tooltip.style.left = (e.clientX+12)+"px"; tooltip.style.top = (e.clientY+12)+"px";
        canvas.style.cursor = "pointer";
      } else { tooltip.classList.add("hidden"); canvas.style.cursor = isDragging?"grabbing":"grab"; }
    });
    window.addEventListener("mouseup", function() { isDragging = false; canvas.classList.remove("dragging"); });
    canvas.addEventListener("click", function(e) {
      var rect = canvas.getBoundingClientRect();
      var hit = engine.hitTest(e.clientX - rect.left, e.clientY - rect.top);
      if (hit >= 0) { engine.selectedIndex = hit; showDetail(hit); }
      else { engine.selectedIndex = -1; detailPanel.classList.add("hidden"); }
      render();
    });
    document.getElementById("close-detail").addEventListener("click", function() {
      engine.selectedIndex = -1; detailPanel.classList.add("hidden"); render();
    });
    function showDetail(idx) {
      var p = engine.points[idx];
      detailTitle.textContent = p.label || "Point " + idx;
      var html = ""; var skip = {label:1,color:1,priority:1};
      var km = {x: engine.axisTitle.x, y: engine.axisTitle.y};
      for (var key in p) {
        if (skip[key]) continue;
        var dk = km[key] || key;
        var val = (typeof p[key] === "number") ? p[key].toFixed(2) : p[key];
        html += '<div class="field"><span class="field-key">' + escH(dk) + ':</span> ' + escH(String(val)) + '</div>';
      }
      detailBody.innerHTML = html; detailPanel.classList.remove("hidden");
    }
    function escH(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

    /* ── Wheel zoom ─────────────────────────────────────────── */
    canvas.addEventListener("wheel", function(e) {
      e.preventDefault();
      var rect = canvas.getBoundingClientRect();
      engine.zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.15 : 1/1.15);
      updateZoom(); render();
    }, {passive:false});

    /* ── Insert into Slide (PowerPoint API) ─────────────────── */
    document.getElementById("insert-btn").addEventListener("click", function() {
      // Render current view to a data URL and insert as image
      engine.draw();  // ensure latest frame
      var dataUrl = canvas.toDataURL("image/png");
      // Strip the data:image/png;base64, prefix
      var base64 = dataUrl.replace(/^data:image\/png;base64,/, "");
      if (typeof PowerPoint !== "undefined" && PowerPoint.run) {
        PowerPoint.run(function(context) {
          var slide = context.presentation.getSelectedSlides().getItemAt(0);
          var imageOptions = {
            base64Image: base64,
            left: 50, top: 50, width: 600, height: 400
          };
          slide.shapes.addImage(imageOptions);
          return context.sync();
        }).then(function() {
          status.textContent = "Inserted into slide.";
        }).catch(function(err) {
          status.textContent = "Insert error: " + err.message;
        });
      } else {
        // Fallback for Office.js context.document.setSelectedDataAsync
        Office.context.document.setSelectedDataAsync(
          base64,
          { coercionType: Office.CoercionType.Image,
            imageLeft: 50, imageTop: 50, imageWidth: 600, imageHeight: 400 },
          function(result) {
            if (result.status === Office.AsyncResultStatus.Succeeded) {
              status.textContent = "Inserted into slide.";
            } else {
              status.textContent = "Insert error: " + result.error.message;
            }
          }
        );
      }
    });

    /* ── Resize ─────────────────────────────────────────────── */
    var rt;
    window.addEventListener("resize", function() {
      clearTimeout(rt); rt = setTimeout(function() { engine.resize(); render(); }, 80);
    });

    /* ── Render ─────────────────────────────────────────────── */
    var rafP = false;
    function render() {
      if (rafP) return; rafP = true;
      requestAnimationFrame(function() { rafP = false; engine.draw(); });
    }

    /* ── Init ───────────────────────────────────────────────── */
    engine.resize();
    loadDemoData();
    updateZoom();
  }
  </script>
</body>
</html>
